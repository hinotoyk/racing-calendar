<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出走表 · RACE ENTRIES</title>
<link rel="stylesheet" href="fonts/noto-sc.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="page">
  <div class="page-title">出走表 · RACE ENTRIES</div>

  <div class="filter-card">
    <div class="filter-head">
      <span class="filter-title">筛选 · FILTER</span>
      <button id="pick-mode" class="f-pick" type="button" title="勾选比赛，生成可分享的出馬表图片">勾选比赛</button>
      <button id="reset" class="f-reset" type="button">清空条件</button>
    </div>
    <div class="filter-row">
      <span class="filter-label">日期</span>
      <div class="filter-chips">
        <button id="d-prev" class="d-nav" type="button" title="更早 5 天">‹</button>
        <span class="filter-chips" id="date-tabs"></span>
        <button id="d-next" class="d-nav" type="button" title="更晚 5 天">›</button>
        <button id="d-today" class="d-nav" type="button">今天</button>
      </div>
    </div>
    <div class="filter-row">
      <span class="filter-label">场地</span>
      <div class="filter-chips" id="scope-chips"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">竞马场</span>
      <div class="filter-chips" id="venue-chips"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">级别</span>
      <div class="filter-chips" id="klass-chips"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">血统</span>
      <div class="filter-chips selects">
        <span class="sel-mount" id="m-sire"></span>
        <span class="sel-mount" id="m-siresire"></span>
        <span class="sel-mount" id="m-bms"></span>
        <input id="f-q" type="search" placeholder="馬名 / 騎手 / 生産牧場 / 馬主">
        <span class="sel-mount" id="m-group"></span>
      </div>
    </div>
    <div class="filter-row">
      <span class="filter-label">快捷</span>
      <div class="filter-chips ped-tags" id="ped-tags"></div>
    </div>
  </div>

  <div class="summary">
    <span id="count" class="count"></span>
    <button id="sel-page" class="sel-page" type="button" hidden title="勾选当前筛选下本页展示的全部行（马）">全选本页</button>
    <button id="desel-page" class="sel-page" type="button" hidden title="取消勾选当前页展示的全部行（马）">取消本页</button>
  </div>

  <div class="table-wrap card">
    <table id="entry-table" class="yj-lib">
      <thead><tr>
        <th class="c-left">当地比赛时间</th><th>北京时间</th><th class="c-left">比赛名</th><th>距离</th>
        <th>枠</th><th>番</th><th class="c-left">馬名</th><th>性齢</th><th>斤量</th>
        <th class="c-left">騎手</th><th class="c-left">調教師</th>
        <th class="c-left">父</th><th class="c-left">父父</th><th class="c-left">母</th><th class="c-left">母父</th>
      </tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>

  <!-- 分页条挂载点（app.js 渲染；页码按钮式，移植 yunji-web races.html .pager） -->
  <div id="pager-mount"></div>

  <!-- 「站群导航」四站互跳（yunji / kzn / jbis / rc；方案说明 = docs/友情跳转方案.md）：
       页脚收尾区挂载点（表格之后、colophon 之前 = 读完内容自然到达的出口，不占首屏）。
       挂载点由 friend-links.js 渲染（data-site 排除自身，皮肤 jbis 与 jbis 站共用），
       颜色经归一化变量取本站 token（--border/--muted-foreground/--primary/--accent/--foreground/
       --card），脚本缺失/渲染失败时挂载点保持空白，无占位观感。 -->
  <div data-friend-links data-site="rc" data-skin="jbis"></div>

  <footer>
    <span>数据来源 JBIS、Racing Post · 版权归原数据方所有</span>
    <span>仅供个人学习、研究 · 赛马应援 · 非商业用途 · 请以官方发布为准</span>
    <span class="ver">v1.0.0</span>
  </footer>
  <div class="powered">power by ディープ求索</div>

  <!-- 勾选比赛浮动条（已选数字可点开上拉预览列表） -->
  <div id="pick-bar" hidden>
    <button id="pick-toggle" class="pb-count" type="button" aria-expanded="false" title="查看已勾选的马">已选 <b id="pick-n">0</b> 頭</button>
    <button id="pick-go" class="pb-go" type="button">生成分享卡</button>
    <button id="pick-clear" class="pb-clear" type="button">清空</button>
    <div id="pick-list" hidden></div>
  </div>

  <!-- 出馬表分享卡视图（app.js 动态 import share.js 后展示） -->
  <section id="share-view" hidden>
    <div class="share-bar">
      <span class="filter-title">出馬表分享卡 · <span id="share-count"></span></span>
      <div class="tools">
        <div id="share-cols" class="filter-chips"></div>
        <label class="share-fld">倍率
          <select id="share-scale"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option></select>
        </label>
        <button id="share-copy" class="sh-btn ghost" type="button">复制到剪贴板</button>
        <button id="share-dl" class="sh-btn" type="button">导出 PNG</button>
        <button id="share-back" class="sh-btn ghost" type="button">返回列表</button>
      </div>
    </div>
    <div class="share-stage"><canvas id="share-canvas"></canvas></div>
    <div class="share-editor">
      <div class="se-head">
        <span class="se-title">分享内容</span>
        <button id="share-add" class="sh-btn ghost" type="button">＋ 手动添加比赛</button>
      </div>
      <div id="share-blocks"></div>
      <form id="share-form" hidden>
        <div class="sf-grid">
          <label>日期<input type="date" id="sf-date"></label>
          <label>竞马场<input id="sf-venue" placeholder="如 京都" required></label>
          <label>R<input type="number" id="sf-no" min="1" placeholder="11"></label>
          <label>比赛名<input id="sf-name" placeholder="如 菊花賞" required></label>
          <label>级别<select id="sf-level">
            <option value="">普通比赛</option><option>G1</option><option>G2</option><option>G3</option>
            <option>L</option><option>OP</option><option>地方重赏</option>
          </select></label>
          <label>场地<select id="sf-surface"><option>芝</option><option>ダ</option><option>障</option></select></label>
          <label>距离<input type="number" id="sf-dist" placeholder="3000"></label>
          <label>当地时间<input type="time" id="sf-time" required></label>
          <label>时区<select id="sf-tz">
            <option value="+09:00">JST 日本 (+9)</option>
            <option value="+08:00">北京时间 (+8)</option>
            <option value="+00:00">UTC±0</option>
            <option value="+01:00">UTC+1</option>
            <option value="-04:00">UTC-4</option>
            <option value="-05:00">UTC-5</option>
            <option value="+10:00">UTC+10</option>
          </select></label>
        </div>
        <label class="sf-lines">出走馬（每行：枠 番 馬名 性齢 騎手，空格分隔，性齢/騎手可省略）
          <textarea id="sf-runners" rows="4" placeholder="1 1 タイキミューズ 牡5 坂井瑠星&#10;2 3 サトノシャイーン 牡5 川田将雅"></textarea>
        </label>
        <div class="sf-actions">
          <button type="submit" class="sh-btn">添加到分享卡</button>
          <button type="button" id="sf-cancel" class="sh-btn ghost">取消</button>
        </div>
      </form>
    </div>
  </section>
</div>
<script src="vendor/qrcode.js"></script>
<script src="friend-links.js" defer></script>
<script type="module" src="app.js"></script>
</body>
</html>
