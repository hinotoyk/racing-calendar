name: results-intraday-thirdparty · 第三方源赛果增量采集

# 第三方源赛果档（当前只有 TJK 土耳其；新增地区按同样方式加一个 step 即可）。
#
# 时刻：土耳其赛事多在当地 13:30–21:00（UTC 10:30–18:00）→ 排 UTC 11/14/17/20 四档
#   （= 土耳其 14/17/20/23 点、北京 19/22/次日 01/04 点），最后一档在当地收赛后 2 小时，
#   保证当天赛果当晚入库；GitHub schedule 漂移 3–6h 也只是往后错，不会漏当天（次轮 --days 1 仍覆盖昨天）。
#
# 链路：官方 CSV medya-cdn.tjk.org/.../GunlukYarisSonuclari（**一城市一次请求**拿到全天所有场次全序着顺）
#   → 按场次号对齐本地出馬表卡片 → 按马名（剥装备码/产地括注）+ 闸位关联马号 → data/results/{date}/tjk-*.json
#   比日本源（1 场 2 请求）与欧美源（1 场 1 请求）都省；CDN 侧无 robots 限制。
#   发送前本地预过滤：整城市都没有「已开赛且未完整入库」的场次 → 0 请求（日志打 [prefilter]）。
on:
  schedule:
    - cron: '0 11,14,17,20 * * *'
  workflow_dispatch:
    inputs:
      dates:
        description: '日期 YYYY-MM-DD,YYYY-MM-DD（留空=今天+昨天，土耳其时区）'
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages      # 与其它档共用，串行发布
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect third-party results (TJK)
        id: collect
        continue-on-error: true
        shell: bash
        env:
          DATES_IN: ${{ inputs.dates || '' }}
        run: |
          set +e
          mkdir -p test-logs
          DATE_ARG=""
          [ -n "$DATES_IN" ] && DATE_ARG="--dates $DATES_IN"
          # --days 2：滚动覆盖今天 / 昨天 / 前天。卡片由 update-thirdparty.yml 每天抓今天+明天，
          # 若某天卡片采集失败，前两天内补上还能救回来；无卡片的日期直接跳过（0 请求）。
          node src/collect-results-tjk.js --days 2 --settle-min 10 --delay 800 $DATE_ARG 2>&1 | tee test-logs/results-tjk.log
          exit 0

      - name: Verify stored results
        if: always()
        run: node src/verify-results.js 2>&1 | tee test-logs/results-verify.log

      # 采集端有新入库才写该标记（.workbuddy/ 已 gitignore，不会进仓库）
      - name: Detect new results
        id: dirty
        if: always()
        run: |
          if [ -f .workbuddy/imports/.results-dirty ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::无新结果，跳过构建 / 提交 / 部署"
          fi

      # 保险丝：本轮写盘若把已有字段洗成空（「无值覆盖有值」），按字段级合并规则自动补回。
      # 判据见 src/lib/merge-safe.mjs；审计白名单：海外 frame（本来就没有枠）与 data/clears.json
      # 登记过的人为纠正。修复结果会随本档的 data 提交一起落库。
      - name: Guard no-downgrade
        if: always()
        run: |
          mkdir -p test-logs
          node src/audit-downgrade.js --restore 2>&1 | tee -a test-logs/downgrade.log
          if grep -qE "发现降级点 [1-9]" test-logs/downgrade.log; then
            echo "::warning::检测到「无值覆盖有值」，已自动补回，详见 downgrade.log"
          fi

      - name: Build site
        if: steps.dirty.outputs.yes == 'true'
        run: node src/build.js 2>&1 | tee test-logs/build.log

      - name: Commit data/results
        if: steps.dirty.outputs.yes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/races/ data/results/   # races 由 Guard 修复时也会改到
          if ! git diff --cached --quiet; then
            git commit -m "data: intraday results (third-party) $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || { git rebase --abort; echo "::error::远端冲突，本次数据提交放弃"; exit 1; }
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "::notice::data/results 已更新并推送"
          else
            echo "::notice::无数据变化，跳过提交"
          fi

      - name: Configure Pages
        if: steps.dirty.outputs.yes == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.dirty.outputs.yes == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # 统一封装：等工件索引落盘 + 同 job 内重试，规避 deploy-pages 的 0 秒瞬时失败
      - name: Deploy to Pages
        if: steps.dirty.outputs.yes == 'true'
        id: deployment
        uses: ./.github/actions/deploy-pages-safe

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-intraday-thirdparty-log-${{ github.run_id }}
          path: |
            test-logs/
            data/logs/requests-*.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Gate on completeness
        if: always()
        run: |
          if grep -q 'INCOMPLETE' test-logs/results-verify.log 2>/dev/null; then
            echo "::warning::仍有不完整结果（partial 未入库），下一轮自动重抓"
          fi
          if grep -qE '\[error\]|error=[1-9]' test-logs/results-tjk.log 2>/dev/null; then
            echo "::warning::本轮采集出现请求错误，见 test-logs/results-tjk.log"
          fi
          if grep -qE '未匹配=[1-9]' test-logs/results-tjk.log 2>/dev/null; then
            echo "::warning::有赛果行未关联到出馬表马匹（马名写法可能变了），见 results-tjk.log"
          fi
