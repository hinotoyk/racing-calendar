name: results-intraday · 日本源赛果增量采集

# 北京时间 08:00–20:00 每 1 小时 = UTC 00:00–12:00（GitHub cron 用 UTC）
#   '0 0-12 * * *' → UTC 0:00…12:00 = 北京 08:00…20:00，整点各一轮
# 抓取范围：今天 + 昨天（JST）还没有完整着顺结果的场次；
# 发送请求前先本地预过滤（读 data/races + data/results 算待抓清单）：
#   整日 / 整场次都已完整 → 连日期级枚举、场次级页眉都不发，日志打 `[prefilter] … → 0 请求`。
# GitHub 排队可能让实际触发后移；脚本只处理「开赛满 10 分钟」的场次，
# 且已完整入库的场次幂等跳过，迟到 / 重复触发不会造成重复抓取。
# 完整性校验在本地脚本完成：只放前三名 / 名次缺号 / 人气未齐 → partial 不入库，下轮重抓。
# 欧美源已拆到 results-intraday-rp.yml（每 6 小时一轮）。
on:
  schedule:
    - cron: '0 0-12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages      # 与 update-jbis-full.yml / update-rp.yml / update-jbis.yml / deploy.yml 共用，串行发布
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 只跑今天+昨天已结束、且着顺/人气尚未完整入库的场次；netkeiba 地域限制时该步失败只告警
      - name: Collect results (netkeiba, today + yesterday)
        continue-on-error: true
        env:
          RC_NK_PROXY: ${{ secrets.RC_NK_PROXY }}
        run: |
          set -o pipefail
          mkdir -p test-logs
          node src/collect-results.js --days 1 --settle-min 10 --delay 1200 2>&1 | tee test-logs/results.log

      - name: Verify stored results
        if: always()
        run: node src/verify-results.js 2>&1 | tee test-logs/results-verify.log

      # 采集端有新入库才写该标记（.workbuddy/ 已 gitignore，不会进仓库）
      - name: Detect new results
        id: dirty
        if: always()
        run: |
          if [ -f .workbuddy/imports/.results-dirty ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::无新结果，跳过构建 / 提交 / 部署"
          fi

      # 保险丝：本轮写盘若把已有字段洗成空（「无值覆盖有值」），按字段级合并规则自动补回。
      # 判据见 src/lib/merge-safe.mjs；审计白名单：海外 frame（本来就没有枠）与 data/clears.json
      # 登记过的人为纠正。修复结果会随本档的 data 提交一起落库。
      - name: Guard no-downgrade
        if: always()
        run: |
          mkdir -p test-logs
          node src/audit-downgrade.js --restore 2>&1 | tee -a test-logs/downgrade.log
          if grep -qE "发现降级点 [1-9]" test-logs/downgrade.log; then
            echo "::warning::检测到「无值覆盖有值」，已自动补回，详见 downgrade.log"
          fi

      - name: Build site
        if: steps.dirty.outputs.yes == 'true'
        run: node src/build.js 2>&1 | tee test-logs/build.log

      - name: Commit data/results
        if: steps.dirty.outputs.yes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/races/ data/results/   # races 由 Guard 修复时也会改到
          if ! git diff --cached --quiet; then
            git commit -m "data: intraday results $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || { git rebase --abort; echo "::error::远端冲突，本次数据提交放弃"; exit 1; }
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "::notice::data/results 已更新并推送"
          else
            echo "::notice::无数据变化，跳过提交"
          fi

      # GITHUB_TOKEN 的 push 不会触发 deploy.yml → 本 workflow 必须自己发布 Pages
      - name: Configure Pages
        if: steps.dirty.outputs.yes == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.dirty.outputs.yes == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # 统一封装：等工件索引落盘 + 同 job 内重试，规避 deploy-pages 的 0 秒瞬时失败
      - name: Deploy to Pages
        if: steps.dirty.outputs.yes == 'true'
        id: deployment
        uses: ./.github/actions/deploy-pages-safe

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-intraday-log-${{ github.run_id }}
          path: |
            test-logs/
            data/logs/requests-*.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Gate on completeness
        if: always()
        run: |
          if grep -q 'INCOMPLETE' test-logs/results-verify.log 2>/dev/null; then
            echo "::warning::仍有不完整结果（partial 未入库），下一轮自动重抓"
          fi
          if grep -qE '\[error\]|error=[1-9]' test-logs/results.log 2>/dev/null; then
            echo "::warning::本轮采集出现请求错误，见 test-logs/results.log"
          fi
