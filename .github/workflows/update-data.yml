name: update-data

# 每日两次采集 → 构建 → 落库 data/ → 重新部署静态页面（Pages）：
#   ① UTC 22:00 = 北京 06:00：JBIS 出馬表（今天起 3 天）+ Racing Post（全国家，
#      美国/中东等夜间卡还挂在 SL racecards 索引里，是抓它们的唯一窗口）
#   ② UTC 10:00 = 北京 18:00：仅 JBIS 出馬表——当天日本场次的枠順/馬番確定后的补采窗口
# 两个 schedule 用 github.event.schedule 区分；手动 dispatch 视同 ①（全量）。
# 结构对齐 yunji-web 的 update-data.yml（采集→构建→提交数据→运行日志 artifact）；
# 差异：GitHub 规定 GITHUB_TOKEN 的 push 不触发其它 workflow，故部署不能依赖 deploy.yml 被 push 触发，
#       由本 workflow 在提交后直接 build + 发布 Pages。
# 前置要求：Settings → Pages → Source = GitHub Actions；
#           Settings → Actions → General → Workflow permissions = Read and write permissions
on:
  schedule:
    - cron: '0 22 * * *'   # 北京 06:00 · 全量（JBIS + RP all）
    - cron: '0 10 * * *'   # 北京 18:00 · 仅 JBIS（枠順补采）
  workflow_dispatch:

permissions:
  contents: write   # 提交数据（data/races、data/pedigree）
  pages: write      # 发布 Pages
  id-token: write

concurrency:
  group: pages      # 与 deploy.yml 共用 pages 组，避免两个发布并发
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # collect-races 内含 JBIS 马名解析（串行 1.2s/匹）+ 彩衣解析；留足 403 退避余量
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve run mode
        id: mode
        run: |
          # 18:00 的 JBIS 补采档（cron '0 10 * * *'）不跑 RP；其余（06:00 档/手动 dispatch）全量
          echo "rp=${{ github.event.schedule != '0 10 * * *' }}" >> "$GITHUB_OUTPUT"

      - name: Collect JBIS racecards
        run: |
          mkdir -p test-logs
          node src/collect-races.js 2>&1 | tee test-logs/jbis.log

      # Sporting Life 对数据中心 IP 的容忍度未验证 → 失败只告警，不阻断 JBIS 数据落库
      # countries=all：GB/IRE/USA/... 全国家（SL racecards index 只滚出「明天起」的会议，
      # 各国当日卡必须在各自的「当天窗口」内抓到，缺一次即错过——育马者杯 Keeneland 10-30/31 即为例证）
      - name: Collect Racing Post (via Sporting Life)
        if: steps.mode.outputs.rp == 'true'
        continue-on-error: true
        run: node src/collect-sources.js --source racingpost --countries all 2>&1 | tee test-logs/rp.log

      # 构建：数据归一 + _site 产出（_site 本身不入库）
      - name: Build site
        run: node src/build.js 2>&1 | tee test-logs/build.log

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/pedigree/*.json 为血统/马名/彩衣缓存包（单文件存储 → 文件数恒定），入库后下次运行增量复用
          # data/silks/：按马主去重的彩衣图（collect 内下载），必须一起入库——否则本次部署能显示、
          #   下次 checkout 缺图 → 缓存命中不再重下 → 页面永久 404（2026-11-05 修）
          git add data/races/ data/pedigree/ data/silks/
          if ! git diff --cached --quiet; then
            git commit -m "data: auto collect $(date -u +%Y-%m-%dT%H:%MZ)"
            # 运行期间 main 可能被推进 → push 前 rebase；冲突则放弃本次（下次调度自动重算）
            git pull --rebase origin main || { git rebase --abort; echo "::error::远端冲突，本次数据提交放弃"; exit 1; }
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "::notice::data 已更新并推送"
          else
            echo "::notice::无变化，跳过提交"
          fi

      # 更新完必须重新部署静态页面：由本 workflow 直接发布（不依赖 push 触发 deploy.yml）
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 运行日志（对齐 yunji-web：always 上传，便于排查采集失败/为空）
      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-log-${{ github.run_id }}
          path: test-logs/
          retention-days: 14
