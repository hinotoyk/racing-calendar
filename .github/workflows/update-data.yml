name: update-data

# 定时采集 JBIS + Racing Post（经 Sporting Life）→ 有变化 commit 回 main → push 触发 deploy.yml 重新发布
# 模式同 yunji-web：数据落仓库（data/races/），Pages 只做静态发布。
# 前置要求：仓库 Settings → Actions → General → Workflow permissions → 勾选 "Read and write permissions"
on:
  schedule:
    # UTC 22:00 = 北京 06:00 = JST 07:00：中央枠順確定后的早盘窗口（当日+3 天）
    - cron: '0 22 * * *'
    # UTC 11:00 = 北京 19:00 = JST 20:00 = 英国午间：地方前日出表 + 英国当日 racecards
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect JBIS racecards
        run: node src/collect-races.js

      # Sporting Life 对数据中心 IP 的容忍度未验证 → 失败只告警，不阻断 JBIS 数据落库
      - name: Collect Racing Post (via Sporting Life)
        continue-on-error: true
        run: node src/collect-sources.js --source racingpost

      # 构建自检：数据能归一、_site 能产出（_site 本身不入库，deploy.yml 会重建）
      - name: Build site (sanity)
        run: node src/build.js

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/races/
          if ! git diff --cached --quiet; then
            git commit -m "data: auto collect $(date -u +%Y-%m-%dT%H:%MZ)"
            # 运行期间 main 可能被 deploy 推进 → push 前 rebase；冲突则放弃本次（下次调度自动重算）
            git pull --rebase origin main || { git rebase --abort; echo "::error::远端冲突，本次数据提交放弃"; exit 1; }
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "::notice::data/races 已更新并推送"
          else
            echo "::notice::无变化，跳过提交"
          fi
