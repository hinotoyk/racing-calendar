name: update-data · 全量采集

# 每日一档全量采集 → 构建 → 落库 data/ → 重新部署静态页面（Pages）：
#   北京 02:00 = UTC 18:00：JBIS 出馬表（今天起 3 天）+ Racing Post（--countries all 全国家）
#   美国/中东等夜间卡只在这个窗口还挂在 SL racecards 索引里，是抓它们的唯一窗口，缺一次即永久错过
# 另一档「枠順补采」拆到 update-jbis.yml：北京 12:00 = UTC 04:00，仅 JBIS，不跑 RP。
# 两档各自独立调度 / 独立手动触发 / 独立 run 历史；共用 concurrency group `pages` 串行发布。
# 结构对齐 yunji-web 的 update-data.yml（采集→构建→提交数据→运行日志 artifact）；
# 差异：GitHub 规定 GITHUB_TOKEN 的 push 不触发其它 workflow，故部署不能依赖 deploy.yml 被 push 触发，
#       由本 workflow 在提交后直接 build + 发布 Pages。
# 前置要求：Settings → Pages → Source = GitHub Actions；
#           Settings → Actions → General → Workflow permissions = Read and write permissions
on:
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = 北京 02:00 · 全量（JBIS + RP all）
  workflow_dispatch:

permissions:
  contents: write   # 提交数据（data/races、data/pedigree）
  pages: write      # 发布 Pages
  id-token: write

concurrency:
  group: pages      # 与 update-jbis.yml / deploy.yml 共用 pages 组，避免两个发布并发
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240  # 安全网：JBIS 80 + RP 120 + build 15 = 215，留余量给提交/发布/诊断；平台上限 360min
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect JBIS racecards
        timeout-minutes: 80
        run: |
          mkdir -p test-logs
          node src/collect-races.js 2>&1 | tee test-logs/jbis.log

      # Sporting Life 对数据中心 IP 的容忍度未验证 → 失败只告警，不阻断 JBIS 数据落库
      # countries=all：GB/IRE/USA/... 全国家（SL racecards index 只滚出「明天起」的会议，
      # 各国当日卡必须在各自的「当天窗口」内抓到，缺一次即错过——育马者杯 Keeneland 10-30/31 即为例证）
      # 超时 120min：历史实测 RP 需 46–55min；9fd66f6 曾设 25min，#22/#23 两次被砍在 25.2min 却判 success
      # 分级闸门：rp-verdict.txt 默认写 FAIL，只有「退出码 0 + 打印 manifest -> 收尾行」才覆盖为 OK；
      #   step 被超时 kill 时文件已落盘为 FAIL，末尾 Gate 读到会让 job 标红（Deploy 已先行，数据照常发布）
      - name: Collect Racing Post (via Sporting Life)
        id: rp
        timeout-minutes: 120
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p test-logs
          echo "FAIL" > test-logs/rp-verdict.txt
          node src/collect-sources.js --source racingpost --countries all 2>&1 | tee test-logs/rp.log
          rc=${PIPESTATUS[0]}
          # collect-sources.js 正常跑完才会打印 "manifest -> ...（written=N skipped=M）"
          if [ "$rc" -eq 0 ] && grep -q '^manifest -> ' test-logs/rp.log; then
            echo "OK" > test-logs/rp-verdict.txt
          else
            echo "::warning::RP 采集未正常收尾（rc=$rc），本次海外数据可能不全"
          fi
          exit "$rc"

      # 着顺结果层（docs/RESULTS.md §4）：枚举 race_id → 出馬表关联 → 赛后结果页 → data/results/
      # CI 出口 IP 可能被 netkeiba 地域限制 → 失败只告警不拦发布；需要代理时配仓库 secret RC_NK_PROXY
      - name: Collect results (netkeiba)
        timeout-minutes: 15
        continue-on-error: true
        shell: bash
        env:
          RC_NK_PROXY: ${{ secrets.RC_NK_PROXY }}
        run: |
          mkdir -p test-logs
          node src/collect-results.js --days 2 2>&1 | tee test-logs/results.log

      # 构建：数据归一 + _site 产出（_site 本身不入库）
      - name: Build site
        timeout-minutes: 15
        run: node src/build.js 2>&1 | tee test-logs/build.log

      # 逐条请求 JSONL（data/logs/，gitignore 不入库）聚合成可读摘要：
      # 直接打印在 Actions step 日志里，无需下载 artifact 就能判断请求量/403/彩衣覆盖/归一结果。
      # if: always() —— 采集或 build 失败/超时也要产出诊断。全量档带 --rp（SL 0 请求 / 0 成功判 FAIL）。
      - name: Diagnostics from JSONL request log
        if: always()
        run: node src/ci-summary.js --rp

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/pedigree/*.json 为血统/马名/彩衣缓存包（单文件存储 → 文件数恒定），入库后下次运行增量复用
          # data/silks/：按马主去重的彩衣图（collect 内下载），必须一起入库——否则本次部署能显示、
          #   下次 checkout 缺图 → 缓存命中不再重下 → 页面永久 404（2026-11-05 修）
          git add data/races/ data/results/ data/pedigree/ data/silks/
          if ! git diff --cached --quiet; then
            git commit -m "data: auto collect $(date -u +%Y-%m-%dT%H:%MZ)"
            # 运行期间 main 可能被推进 → push 前 rebase；冲突则放弃本次（下次调度自动重算）
            git pull --rebase origin main || { git rebase --abort; echo "::error::远端冲突，本次数据提交放弃"; exit 1; }
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "::notice::data 已更新并推送"
          else
            echo "::notice::无变化，跳过提交"
          fi

      # 更新完必须重新部署静态页面：由本 workflow 直接发布（不依赖 push 触发 deploy.yml）
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 运行日志（对齐 yunji-web：always 上传，便于排查采集失败/为空）
      # data/logs/requests-*.jsonl = 逐条出站请求（src/url/status/ok/ms/bytes/err），
      # 本地 gitignore 不入库，只在 CI 作为 artifact 留存；配合 summary.log 定位到具体 URL。
      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-full-log-${{ github.run_id }}
          path: |
            test-logs/
            data/logs/requests-*.jsonl
          if-no-files-found: warn
          retention-days: 30

      # 摘要判 FAIL 时让 job 显式失败（放最后，保证上面的 artifact 已经上传）
      # 两个信号：verdict.txt（ci-summary 的 OK/WARN/FAIL）+ rp-verdict.txt（RP 是否正常收尾）
      # Deploy to Pages 在本步之前 → FAIL 只标红报警，页面和数据照常发布
      - name: Gate on diagnostics
        if: always()
        run: |
          v="$(cat test-logs/verdict.txt 2>/dev/null || echo FAIL)"
          rp="$(cat test-logs/rp-verdict.txt 2>/dev/null || echo FAIL)"
          echo "verdict=$v rp=$rp"
          if [ "$v" = "FAIL" ] || [ "$rp" = "FAIL" ]; then
            echo "::error::采集/构建异常，见 update-full-log artifact 的 summary.log 与 requests-*.jsonl"
            exit 1
          fi
