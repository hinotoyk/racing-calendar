name: Deploy to GitHub Pages

# push main（人工推代码）→ 构建静态站点 → 发布 Pages
# 注意：采集类 workflow 用 GITHUB_TOKEN 提交的数据不会触发本 workflow，故它们各自直接发布 Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment3.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 零依赖（纯 node:std ESM），无需 npm ci
          node-version: 22

      - name: Build static site
        run: node src/build.js

      # build.js 同时会写 _site/.nojekyll（双保险）；全站相对路径，任意 base path 可用
      - name: Verify nojekyll
        run: test -f _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # deploy-pages 偶发「Fetching artifact metadata failed / No artifacts named
      # github-pages found」——工件上传明明成功，是 Actions API 拉取元数据的瞬时故障
      # （2026-11-23 yunji/kzn/rc 同款：构建/上传全绿、Deploy 0 秒失败）。
      # 兜底：continue-on-error 让本步失败不终结 job，同 job 内等 15s 后重试，最多 3 次。
      # （不能用独立 job 重试：实测同 run 第二个声明 github-pages environment 的 job
      #  调度即失败，runner 未分配 —— Pages 环境瞬态锁定所致。yunji 已实战验证。）
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry (attempt 2)
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Deploy (retry attempt 2)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Wait before retry (attempt 3)
        if: failure() && steps.deployment2.outcome == 'failure'
        run: sleep 15

      - name: Deploy (retry attempt 3)
        id: deployment3
        if: failure() && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
