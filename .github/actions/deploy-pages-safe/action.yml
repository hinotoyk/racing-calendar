name: Deploy to GitHub Pages（就绪等待 + 重试）
description: >-
  封装 actions/deploy-pages，规避「工件已上传成功、但 Actions 工件索引尚未就绪」
  导致的 0 秒瞬时失败（报错 Fetching artifact metadata failed / No artifacts named
  "github-pages" were found）。做法：首次部署前留出落盘窗口，失败后同 job 内
  再重试，全部尝试失败才把 job 标红——避免一次瞬时抖动就红掉整轮采集。

inputs:
  attempts:
    description: 总尝试次数（1–3）
    required: false
    default: "3"
  settle-seconds:
    description: 首次部署前的等待秒数（等工件索引落盘）
    required: false
    default: "20"
  retry-wait-seconds:
    description: 两次尝试之间的等待秒数
    required: false
    default: "20"

outputs:
  page_url:
    description: 发布后的站点地址（取首个成功的尝试）
    value: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}

runs:
  using: composite
  steps:
    # 实测：upload-pages-artifact 报 finalize 成功到 deploy-pages 查询工件列表，
    # 间隔常在 0.3–0.8s；此时 API 有概率仍返回 0 个工件。留 20s 落盘窗口。
    - name: 等待工件落盘
      shell: bash
      run: sleep ${{ inputs.settle-seconds }}

    - name: Deploy (attempt 1)
      id: deploy1
      continue-on-error: true
      uses: actions/deploy-pages@v4

    - name: 等待重试 (attempt 2)
      if: steps.deploy1.outcome == 'failure' && inputs.attempts != '1'
      shell: bash
      run: sleep ${{ inputs.retry-wait-seconds }}

    - name: Deploy (attempt 2)
      id: deploy2
      if: steps.deploy1.outcome == 'failure' && inputs.attempts != '1'
      continue-on-error: true
      uses: actions/deploy-pages@v4

    - name: 等待重试 (attempt 3)
      if: steps.deploy2.outcome == 'failure' && inputs.attempts == '3'
      shell: bash
      run: sleep ${{ inputs.retry-wait-seconds }}

    - name: Deploy (attempt 3)
      id: deploy3
      if: steps.deploy2.outcome == 'failure' && inputs.attempts == '3'
      continue-on-error: true
      uses: actions/deploy-pages@v4

    # 瞬时抖动重试即可恢复；连续三次都失败说明是真故障，保留红灯信号。
    # 注意：此时数据已提交进仓库，下一轮成功部署会自动把页面刷成最新。
    - name: 全部尝试失败 → 报错
      if: >-
        steps.deploy1.outcome == 'failure' &&
        (inputs.attempts == '1' || steps.deploy2.outcome == 'failure') &&
        (inputs.attempts != '3' || steps.deploy3.outcome == 'failure')
      shell: bash
      run: |
        echo "::error::Pages 部署连续失败，见上方各 attempt 的报错。数据已提交，下一轮成功部署会覆盖页面。"
        exit 1
